[package]
name = "christmas"
description = "christmas drawings for my family"
authors.workspace = true
categories.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
dioxus = { workspace = true, features = ["fullstack", "router"] }
fastrand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracingx = { path = "../lib/tracingx" }

axum = { workspace = true, optional = true }
postgresql_embedded = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["chrono"] }
tokio = { workspace = true, features = ["full"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }
web-sys = { workspace = true, features = ["Storage", "Window"] }

[[bin]]
name = "christmas"
path = "src/main.rs"

[lib]
name = "christmas"
path = "src/lib.rs"

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:axum", "dep:rand", "dep:tokio", "dep:sqlx"]
# Bundles an entire PostgreSQL distribution into the binary for zero-setup local
# development. Deliberately NOT part of `server` so production images stay small.
embedded = ["server", "dep:postgresql_embedded"]

[lints]
workspace = true
