name: Build christmas image

on:
  push:
    branches: [main]
    paths:
      - "christmas/**"
      - "lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/deploy-christmas.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also restart the service on the droplet"
        type: boolean
        default: false

# A second push to main should not race the first one onto the droplet.
concurrency:
  group: christmas-image
  cancel-in-progress: false

env:
  ECR_REPOSITORY: christmas

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            APP_NAME=christmas
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          # Scoped so this image's cache doesn't thrash against other apps'.
          cache-from: type=gha,scope=christmas
          cache-to: type=gha,mode=max,scope=christmas

      - name: Record image reference
        id: meta
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### christmas image pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The compose file and Caddyfile live in the arenabuddy repo, so this only
  # restarts an already-declared service. See christmas/DEPLOY.md for the
  # one-time setup that has to land there first.
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Restart christmas on the droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            source /root/.env

            ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd /root/code/arenabuddy/server
            export CHRISTMAS_IMAGE="$ECR_REGISTRY/christmas:${{ github.sha }}"
            docker compose pull christmas
            docker compose up -d christmas
            docker image prune -f
